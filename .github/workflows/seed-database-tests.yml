name: Seed database tests

on:
  push:
    paths:
      - 'seed-treatment-database/**'
      - '.github/workflows/seed-database-tests.yml'
  pull_request:
    paths:
      - 'seed-treatment-database/**'
      - '.github/workflows/seed-database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and JavaScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run tests and build standalone database
        run: python seed-treatment-database/test_project.py --require-node
      - name: Check browser interactions and responsive matrix
        timeout-minutes: 10
        run: bash seed-treatment-database/run_browser_tests.sh
      - name: Save browser review output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seed-interface-review
          path: seed-treatment-database/.test-artifacts/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
