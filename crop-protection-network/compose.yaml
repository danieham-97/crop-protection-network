services:
  explorer:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Chicago}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-21600}
      EPA_DUMP_URL: ${EPA_DUMP_URL:-}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - catalog:/app/data
    restart: unless-stopped
    stop_grace_period: 120s
volumes:
  catalog:
